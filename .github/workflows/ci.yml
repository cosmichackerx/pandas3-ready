name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action-metadata:
    name: action.yml metadata (Marketplace limits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: name, description (max 125 characters) and branding are present and valid
        run: |
          python3 - <<'PY'
          import re
          t = open("action.yml", encoding="utf-8").read()
          name = re.search(r"^name:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          desc = re.search(r"^description:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          icon = re.search(r"^  icon:\s*(\S+)", t, re.M)
          color = re.search(r"^  color:\s*(\S+)", t, re.M)
          assert name, "name missing"
          assert 0 < len(desc) <= 125, f"description is {len(desc)} characters; the Marketplace allows at most 125"
          assert icon and color, "branding icon and color are required"
          assert color.group(1) in {"white", "black", "yellow", "blue", "green", "orange", "red", "purple", "gray-dark"}, color.group(1)
          print(f"ok: {name!r}, description {len(desc)} characters, icon {icon.group(1)}, color {color.group(1)}")
          PY

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install .
      - run: python -m pytest -q
      - name: Installed CLI runs
        run: |
          pandas3-ready --version
          pandas3-ready --list-rules

  oracle:
    # Every claim of the form "pandas 3 raises / ignores / changes X" is run on real pandas 2.3.3 and on pandas 3.x, and the scanner is checked against the result.
    name: oracle (pandas 2.3.3 vs ${{ matrix.new }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        new: ["3.0.0", "3.0.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Two virtualenvs with pinned pandas
        run: |
          python -m venv "$RUNNER_TEMP/old" && "$RUNNER_TEMP/old/bin/pip" install -q "pandas==2.3.3" lxml
          python -m venv "$RUNNER_TEMP/new" && "$RUNNER_TEMP/new/bin/pip" install -q "pandas==${{ matrix.new }}" lxml
      - name: Run every case on both
        run: |
          "$RUNNER_TEMP/old/bin/python" tests/oracle/run_oracle.py --exec "$RUNNER_TEMP/old.json"
          "$RUNNER_TEMP/new/bin/python" tests/oracle/run_oracle.py --exec "$RUNNER_TEMP/new.json"
      - name: Compare; fail on any disagreement between pandas and the scanner
        run: python tests/oracle/run_oracle.py "$RUNNER_TEMP/old.json" "$RUNNER_TEMP/new.json" | tee -a "$GITHUB_STEP_SUMMARY"

  action:
    name: action (this checkout, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Migrated fixture passes
        uses: ./
        with:
          path: tests/fixtures/clean
          fail-on: warning
          sarif-file: ${{ runner.temp }}/pandas3.sarif
      - name: Legacy fixture fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/legacy
      - name: It really failed
        run: test "${{ steps.bad.outcome }}" = "failure"
      - name: SARIF was written
        run: python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['version']=='2.1.0'" "$RUNNER_TEMP/pandas3.sarif"

  package:
    name: build wheel and sdist, install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/pandas3-ready tests/fixtures/clean

  dependabot-gaps:
    name: dependabot-gaps (released action, consumer test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cosmichackerx/dependabot-gaps@v0.2.1
        with:
          fail-on: warning
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  node24-ready:
    name: node24-ready (this repository's workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/node24-ready@v0.8.0
        with:
          path: .github action.yml
          fail-on: error

  claims:
    name: README claims (claims-check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - uses: cosmichackerx/claims-check@v0.3.0

  pre-commit:
    name: pre-commit hook (try-repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pre-commit
      - name: Hook passes on the migrated fixture and fails on the legacy one
        run: |
          work="$RUNNER_TEMP/pc"
          rm -rf "$work"; mkdir -p "$work/clean" "$work/legacy"
          cp -r tests/fixtures/clean/. "$work/clean/"
          cp -r tests/fixtures/legacy/. "$work/legacy/"
          for d in clean legacy; do
            (cd "$work/$d" && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m fixture)
          done
          (cd "$work/clean" && pre-commit try-repo "$GITHUB_WORKSPACE" pandas3-ready --all-files)
          if (cd "$work/legacy" && pre-commit try-repo "$GITHUB_WORKSPACE" pandas3-ready --all-files); then echo "the hook should fail on the legacy fixture"; exit 1; fi

  comment-selftest:
    name: PR mode and sticky comment (same-repo pull requests)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: First run creates the comment
        uses: ./
        with:
          path: tests/fixtures/legacy
          pr-mode: "true"
          comment: "true"
          fail-on: never
      - name: Second run updates the same comment
        uses: ./
        with:
          path: tests/fixtures/legacy
          pr-mode: "true"
          comment: "true"
          fail-on: never
      - name: Exactly one sticky comment exists, and it is a PR mode report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments"
          n="$(gh api "$url" --paginate --jq '[.[] | select(.body | startswith("<!-- pandas3-ready:sticky -->"))] | length' | awk '{s+=$1} END{print s+0}')"
          m="$(gh api "$url" --paginate --jq '[.[] | select((.body | startswith("<!-- pandas3-ready:sticky -->")) and (.body | contains("introduced since")))] | length' | awk '{s+=$1} END{print s+0}')"
          echo "sticky comments: $n, PR-mode ones: $m"
          test "$n" = "1" && test "$m" = "1"
